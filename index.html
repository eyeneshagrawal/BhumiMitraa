<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#fff;--red:#e11d2e;--red-d:#b7141f;--g50:#fafafa;--g100:#f2f2f2;--g200:#e5e5e5;--g300:#d4d4d4;--g400:#a3a3a3;--g500:#737373;--g600:#525252;--ok:#1a8f4c;--blue:#2a6f8f;--nav:60px;--side:224px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.dark{--black:#fff;--white:#0a0a0a;--g50:#141414;--g100:#1a1a1a;--g200:#262626;--g300:#333;--g400:#5c5c5c;--g500:#8a8a8a;--g600:#b3b3b3;--ok:#3fbf75;--blue:#5fb0d0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + env(safe-area-inset-top,0px))}
body{font:400 clamp(14px,.3vw + 12.8px,17px)/1.55 Poppins,system-ui,sans-serif;background:var(--white);color:var(--black);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}ul{list-style:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
h1,h2,h3{letter-spacing:-.02em;font-weight:700}
.h1{font-size:clamp(30px,4.6vw,44px);line-height:1.1}.h2{font-size:26px;line-height:1.2}.h3{font-size:16px;line-height:1.35;font-weight:600}
.lead{font-size:16.5px;color:var(--g600);max-width:62ch}.mut{color:var(--g500);font-size:12.5px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:8px;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-weight:600;font-size:14px;border-radius:4px;border:1px solid var(--black);line-height:1;transition:.15s;white-space:nowrap}
.btn.p{background:var(--black);color:var(--white)}.btn.p:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.s:hover{background:var(--black);color:var(--white)}.btn.sm{padding:8px 13px;font-size:13px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* navbar */
.navbar{position:sticky;top:0;z-index:50;height:calc(var(--nav) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--white) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--g200)}
.nav-in{display:flex;align-items:center;gap:14px;height:var(--nav);padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--black);color:var(--white);display:grid;place-items:center;font-weight:800;font-size:14px}.mark b{color:var(--red)}
.sbox{flex:1;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--g300);border-radius:6px;padding:8px 12px;background:var(--g50);position:relative}
.sbox:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,46,.1)}
.sbox input{flex:1;border:0;background:none;outline:0;min-width:0}.sbox kbd{font-size:11px;border:1px solid var(--g300);border-radius:4px;padding:0 6px;color:var(--g500)}
.sug{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--white);border:1px solid var(--g300);border-radius:6px;display:none;max-height:300px;overflow:auto}
.sug a{display:block;padding:10px 14px;border-bottom:1px solid var(--g200);font-size:13.5px}.sug a:hover{background:var(--g50)}
.circ{width:34px;height:34px;border:1px solid var(--g200);border-radius:50%;display:grid;place-items:center}.circ:hover{border-color:var(--red);color:var(--red)}
.ham{display:none}
/* shell */
.shell{display:grid;grid-template-columns:var(--side) 1fr;max-width:1440px;margin:0 auto}
.side{position:sticky;top:var(--nav);height:calc(100vh - var(--nav));height:calc(100dvh - var(--nav));overflow:auto;padding:18px 12px;border-right:1px solid var(--g200)}
.side h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);margin:16px 10px 6px;font-weight:600}
.side a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--g600)}
.side a:hover{background:var(--g100);color:var(--black)}
.side a.on{background:var(--g100);color:var(--black);box-shadow:inset 3px 0 0 var(--red)}
main{min-width:0;padding:36px 32px 64px}
.sec{padding:0 0 44px}.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
/* hairline grid */
.grid{display:grid;gap:1px;background:var(--g200);border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cell{background:var(--white);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;min-height:150px;transition:.15s}
a.cell:hover{background:var(--g50)}a.cell:hover .ic.ar{color:var(--red);transform:translate(3px,-3px)}
.cell .ic.ar{position:absolute;top:18px;right:18px;color:var(--g400);transition:.2s}
.ibox{width:38px;height:38px;border:1px solid var(--g200);border-radius:6px;display:grid;place-items:center}
.cell p{color:var(--g600);font-size:13.5px}
.stat b{font-size:28px;letter-spacing:-.02em}.stat span{color:var(--g500);font-size:12.5px}.stat em{font-style:normal;font-size:12px;font-weight:600;color:var(--ok)}.stat em.dn{color:var(--red)}
/* rows (kaggle style listings) */
.list{border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:16px 20px;border-bottom:1px solid var(--g200);background:var(--white)}
.row:last-child{border-bottom:0}.row:hover{background:var(--g50)}.row:hover .h3{color:var(--red)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--g500);font-size:12.5px;align-items:center}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--g100);color:var(--g600)}.badge.r{background:#fdecec;color:var(--red-d)}body.dark .badge.r{background:#3a1216;color:#ff8f99}
.use{display:inline-flex;align-items:center;gap:6px}.use i{width:54px;height:5px;background:var(--g200);border-radius:9px;overflow:hidden}.use i u{display:block;height:100%;background:var(--ok)}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--g300);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:500;color:var(--g600)}.chip:hover{border-color:var(--black);color:var(--black)}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--black);border-color:var(--black);color:var(--white)}
select,input[type=text]{border:1px solid var(--g300);border-radius:6px;padding:8px 12px;background:var(--white)}
/* map */
.mapc{border:1px solid var(--g200);border-radius:8px;padding:14px;background:var(--g50)}
canvas{width:100%;display:block;border-radius:6px;background:#0b2e2a;aspect-ratio:12/7;cursor:crosshair}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--g600)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.ro{margin-top:10px;font-size:13.5px;min-height:2.4em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{border:1px solid var(--g200);border-radius:8px;padding:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--g300);margin:14px 0 26px}.bars div{flex:1;background:var(--black);position:relative;border-radius:3px 3px 0 0}.bars div:nth-child(even){background:var(--red)}.bars small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--g500)}
.pr{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}.pr span{width:96px;color:var(--g600)}.pr .t{flex:1;height:8px;background:var(--g200);border-radius:9px;overflow:hidden}.pr .t i{display:block;height:100%;background:var(--red)}
.sim label{display:flex;justify-content:space-between;margin:16px 0 6px;font-weight:500;font-size:13.5px}.sim output{color:var(--red);font-weight:600}input[type=range]{width:100%;accent-color:var(--red)}
.res{background:var(--black);color:var(--white);border-radius:8px;padding:24px}.res .n{font-size:44px;font-weight:700;color:#ff5a68;letter-spacing:-.03em}
.res .pr span{color:#bbb}.res .pr .t{background:#ffffff30}.res .pr .t i{background:#ff5a68}body.dark .res{background:var(--g100);color:var(--black)}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kan div{background:var(--g50);border:1px dashed var(--g300);border-radius:6px;padding:10px;font-size:13px;min-height:110px}.kan p{background:var(--white);border:1px solid var(--g200);border-radius:4px;padding:6px 9px;margin:6px 0}
pre{background:#0a0a0a;color:#eaeaea;padding:16px;border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--g200)}th{color:var(--g500);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.hero{padding:8px 0 40px;max-width:760px}.cta{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
footer{border-top:1px solid var(--g200);padding:32px 20px;color:var(--g500);font-size:13px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:80;padding:16px}.modal.on{display:grid}
.mc{background:var(--white);border:1px solid var(--g200);border-radius:10px;padding:26px;width:100%;max-width:400px}.mc label{display:block;font-size:13px;font-weight:500;margin:14px 0 5px}.mc input,.mc select{width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,90px);background:var(--black);color:var(--white);padding:10px 18px;border-radius:6px;z-index:90;font-size:13.5px;transition:.3s}#toast.on{transform:translate(-50%,0)}
.scrim{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;height:auto;width:250px;z-index:70;background:var(--white);transform:translateX(-100%);transition:.25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.on{transform:none}.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}.ham{display:grid}main{padding:24px 16px 48px}.two,.kan{grid-template-columns:1fr}.logo span.t{display:none}.row{grid-template-columns:1fr}.right{align-items:flex-start;text-align:left;flex-direction:row}}
@media(min-width:1500px){.shell{max-width:1680px;grid-template-columns:250px 1fr}main{padding:44px 52px 72px}.hero{max-width:860px}}
@media(min-width:2000px){.shell{max-width:2000px}main{padding:52px 72px 80px}}
@media(max-width:900px){.side{height:auto;bottom:0}.mc{max-height:90vh;overflow:auto}.mapc,.box{padding:14px}}
@media(max-width:600px){.nav-in{gap:8px;padding:0 12px}.sbox{padding:7px 10px}.sbox kbd{display:none}#lg{max-width:112px;overflow:hidden;text-overflow:ellipsis;padding:8px 10px}.cell{padding:18px;min-height:0}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.hd{align-items:flex-start}.bars{gap:4px}.res{padding:18px}.res .n{font-size:36px}.pr span{width:78px}.cta .btn{flex:1;justify-content:center}.row{padding:14px}.chips{gap:6px}.chip{padding:5px 11px;font-size:12.5px}#so{margin-left:0!important;width:100%}.h2{font-size:22px}}
@media(max-width:380px){.g4{grid-template-columns:1fr}.logo{display:none}.sbox input{font-size:13px}}
@media(max-height:500px) and (orientation:landscape){.side{overflow:auto}}
@media print{.navbar,.side,footer,#toast{display:none}.shell{display:block}}
/* fit-to-screen fixes */
html,body{max-width:100%;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.shell{flex:1 0 auto;width:100%}
.navbar,.nav-in{max-width:100%;width:100%}
.sbox{min-width:0}
.sbox input{border:0!important;padding:0!important;background:none!important;box-shadow:none!important;width:100%;min-width:0;border-radius:0}
#lg,.circ,.ham,.logo{flex-shrink:0}
main,.grid,.cell,.row>*,.box,.two>*{min-width:0}
.h1,.h2,.h3,.lead{overflow-wrap:break-word}
footer{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){input,select{font-size:16px}.sbox input{font-size:15px}}
@media(max-width:430px){.logo{display:none}.nav-in{gap:8px}#lg{max-width:96px}}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.cell.stat{padding:14px}.stat b{font-size:22px}}
@media(max-width:380px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* home cards */
.kc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:20px}
.kcard{border:1px solid var(--g200);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--white);cursor:pointer;transition:.15s;min-width:0}.kcard:hover{box-shadow:0 4px 18px rgba(0,0,0,.14)}
.kt{height:110px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;text-align:center;padding:8px 14px;line-height:1.1;letter-spacing:-.02em}
.kb{padding:14px 16px;flex:1}.kb .h3{font-size:15px;overflow-wrap:break-word}.kb p{color:var(--g500);font-size:12.5px;margin-top:6px}.kb .k1{text-decoration:underline;text-underline-offset:2px}
.kf{border-top:1px solid var(--g200);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.vp{border:1px solid var(--g300);border-radius:99px;padding:3px 12px;font-size:13px}.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--red),#333)}
/* open-source map (MapLibre GL essentials, inlined) */
.maplibregl-map{position:relative;overflow:hidden;font:12px/20px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab;user-select:none}.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas{touch-action:pan-x pan-y}.maplibregl-canvas-container.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:pinch-zoom}.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:none}

.maplibregl-ctrl-top-left{top:0;left:0}.maplibregl-ctrl-top-right{top:0;right:0}.maplibregl-ctrl-bottom-left{bottom:0;left:0}.maplibregl-ctrl-bottom-right{bottom:0;right:0}

.maplibregl-ctrl-group{border-radius:4px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.maplibregl-ctrl-group button{width:32px;height:32px;display:block;padding:0;border:0;background:transparent;cursor:pointer;color:#000}.maplibregl-ctrl-group button+button{border-top:1px solid #ddd}.maplibregl-ctrl-group button:hover{background:#f2f2f2}
.maplibregl-ctrl-icon{display:block;width:100%;height:100%;font:bold 20px/32px monospace;text-align:center}
.maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon::before{content:'+'}.maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon::before{content:'\2212'}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,.85);padding:0 6px;font-size:11px;color:#333}.maplibregl-ctrl-attrib a{color:#0a5a8a}.maplibregl-ctrl-attrib-button{display:none}
.maplibregl-ctrl-scale{background:rgba(255,255,255,.85);border:2px solid #777;border-top:0;padding:0 5px;font-size:11px;color:#333;white-space:nowrap;box-sizing:border-box}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}

.maplibregl-popup-content{position:relative;background:#fff;color:#111;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.35);padding:12px 26px 12px 14px;pointer-events:auto;font-size:13px;line-height:1.5;text-align:left}
.maplibregl-popup-content a{color:#c81a28;font-weight:600}

.maplibregl-popup-anchor-bottom{flex-direction:column-reverse}.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{align-self:center;border-top-color:#fff;border-bottom:none}
.maplibregl-popup-anchor-top{flex-direction:column}.maplibregl-popup-anchor-top .maplibregl-popup-tip{align-self:center;border-bottom-color:#fff;border-top:none}
.maplibregl-popup-anchor-left{flex-direction:row}.maplibregl-popup-anchor-left .maplibregl-popup-tip{align-self:center;border-right-color:#fff;border-left:none}
.maplibregl-popup-anchor-right{flex-direction:row-reverse}.maplibregl-popup-anchor-right .maplibregl-popup-tip{align-self:center;border-left-color:#fff;border-right:none}
.maplibregl-popup-close-button{position:absolute;top:0;right:0;width:26px;height:26px;font-size:18px;line-height:26px;color:#666;background:transparent;border:0;cursor:pointer}

.osmt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hlg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--g600);margin-top:10px}.hlg i{display:block;width:200px;max-width:50%;height:10px;border-radius:9px;background:linear-gradient(90deg,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

<body>
<header class="navbar"><div class="nav-in">
<button class="circ ham" id="ham" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<a class="logo" href="#/home"><span class="mark">B<b>.</b></span><span class="t">Bhumi Manthan</span></a>
<div class="sbox"><svg class="ic" viewBox="0 0 24 24" style="color:var(--g400)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="gs" type="text" placeholder="Search datasets, research, policies, discussions" aria-label="Search" autocomplete="off"><kbd>/</kbd><div class="sug" id="sug"></div></div>

</div></header>

</div>

const n=(x,y,s)=>((Math.sin(x*1.7+s)*Math.cos(y*1.3-s*.7)+Math.sin((x+y)*.8+s*2)*.5)+1.5)/3;
const use=(x,y)=>{const v=n(x,y,1);return v<.28?['Water','#2a6f8f']:v<.5?['Forest','#2f6b46']:v<.75?['Agriculture','#c9b458']:v<.88?['Built-up','#b8654f']:['Barren','#8d8a7a']};

const pick=e=>{const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e,x=Math.floor((p.clientX-r.left)/r.width*C),y=Math.floor((p.clientY-r.top)/r.height*R);if(x<0||y<0||x>=C||y>=R)return;sel=[x,y];draw();$('#mro').innerHTML=`<b>Block ${String.fromCharCode(65+y)}${x+1}</b> · ${L.use.f(x,y)[1]} · ${L[cur].f(x,y)[1]} · ${Math.round(n(x,y,3)*900+100)} parcels`};

r.sort((a,b)=>so==1?b[0][5]-a[0][5]:so==2?b[0][4]-a[0][4]:b[1]-a[1]);$('#dl').innerHTML=r.length?r.map(x=>dsRow(x[0])).join(''):'<div class="row"><p class="mut">No results. Try a broader term such as "records", "flood" or "survey".</p></div>'};
